{% extends "base.html" %}

{% block content %}

<style>

.page-title{
    color:#244C82;
    margin-top:0;
}

.form-card{
    max-width:800px;
    margin:auto;
}

.error-box{
    background:#ffe5e5;
    border:1px solid #dc3545;
    color:#842029;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

form p{
    margin-bottom:18px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ced4da;
    border-radius:8px;
    box-sizing:border-box;
    font-size:16px;
}

textarea{
    min-height:120px;
}

.save-button{
    width:100%;
    border:none;
    border-radius:8px;
    padding:14px;
    margin-top:20px;

    background:#244C82;
    color:white;

    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.save-button:hover{
    opacity:0.9;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#244C82;
    font-weight:bold;
}

</style>

<div class="card form-card">

<h1 class="page-title">
🚆 Neue Fahrt erfassen
</h1>

{% if form.errors %}
<div class="error-box">
    <strong>Bitte korrigiere die markierten Felder.</strong>
    <br><br>
    {{ form.errors }}
</div>
{% endif %}

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<button
    type="submit"
    class="save-button"
>
💾 Fahrt speichern
</button>

</form>

<a
    href="/fahrten/"
    class="back-link"
>
← Zurück zu meinen Fahrten
</a>

</div>

{% endblock %}
